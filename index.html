<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>深圳 → 西安</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E6DF;
  --paper-2:#F1F2ED;
  --ink:#1B201D;
  --ink-soft:#5A655E;
  --ink-faint:#8D968F;
  --cinnabar:#B33F2B;
  --jade:#3B6252;
  --loess:#B98E4E;
  --rule:#C6C9C0;
  --serif:"Noto Serif SC",Georgia,serif;
  --sans:"Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  font-size:17px;
  line-height:1.65;
}
::selection{background:var(--cinnabar);color:var(--paper-2)}
a{color:var(--cinnabar);text-decoration-thickness:1px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--cinnabar);outline-offset:3px}

/* ---------- gate ---------- */
#gate{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px;
}
#gate .box{width:100%;max-width:340px;text-align:left}
#gate .seal{
  width:56px;height:56px;
  background:var(--cinnabar);
  color:var(--paper-2);
  display:grid;place-items:center;
  font-family:var(--serif);font-weight:900;font-size:26px;
  margin-bottom:22px;
}
#gate h1{
  font-family:var(--serif);font-weight:600;
  font-size:23px;line-height:1.3;margin:0 0 6px;
}
#gate p{margin:0 0 22px;color:var(--ink-soft);font-size:14.5px}
#gate input{
  width:100%;padding:13px 14px;
  border:1px solid var(--ink);border-radius:0;
  background:var(--paper-2);color:var(--ink);
  font-family:var(--sans);font-size:16px;
}
#gate button{
  width:100%;margin-top:10px;padding:13px;
  border:1px solid var(--ink);border-radius:0;
  background:var(--ink);color:var(--paper-2);
  font-family:var(--sans);font-size:15px;font-weight:500;
  cursor:pointer;
}
#gate button:hover{background:var(--cinnabar);border-color:var(--cinnabar)}
#gate button[disabled]{opacity:.55;cursor:wait}
#err{margin:12px 0 0;min-height:20px;color:var(--cinnabar);font-size:14px}

/* ---------- layout ---------- */
#doc{display:none;max-width:1080px;margin:0 auto;padding:0 22px 100px}
#doc.on{display:block}

/* ---------- hero ---------- */
.hero{padding:64px 0 40px;border-bottom:1px solid var(--rule)}
.hero .route{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(38px,9vw,78px);
  line-height:1.02;margin:0 0 4px;letter-spacing:-.01em;
}
.hero .route .arrow{color:var(--cinnabar)}
.hero .latin{
  font-family:var(--sans);font-weight:300;
  font-size:clamp(17px,3.4vw,25px);
  color:var(--ink-soft);margin:0 0 30px;
}
.facts{
  display:flex;flex-wrap:wrap;gap:0 34px;
  padding:0;margin:0;list-style:none;
  font-size:14.5px;color:var(--ink-soft);
}
.facts b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;color:var(--ink)}
.profile{margin:34px 0 0;width:100%;height:auto;display:block}

/* ---------- generic sections ---------- */
section{padding:52px 0;border-bottom:1px solid var(--rule)}
h2{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(24px,4.4vw,32px);
  line-height:1.25;margin:0 0 8px;
}
.lede{color:var(--ink-soft);margin:0 0 30px;max-width:62ch}
h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:30px 0 6px}
p{max-width:68ch}

/* ---------- day spine ---------- */
.day{
  display:grid;
  grid-template-columns:62px 1fr;
  gap:0 26px;
  padding:44px 0;
  border-bottom:1px solid var(--rule);
}
.day:last-of-type{border-bottom:0}
.spine{position:relative}
.seal{
  width:50px;height:50px;background:var(--cinnabar);color:var(--paper-2);
  display:grid;place-items:center;
  font-family:var(--serif);font-weight:900;font-size:22px;
  line-height:1;
}
.seal.rest{background:var(--jade)}
.spine::after{
  content:"";position:absolute;left:24px;top:60px;bottom:-44px;
  width:1px;background:var(--rule);
}
.day:last-of-type .spine::after{display:none}
.stage{font-size:12.5px;color:var(--ink-faint);margin:10px 0 0;writing-mode:horizontal-tb}

.day h3{margin:0 0 2px;font-size:clamp(20px,3.6vw,26px);font-weight:600}
.hanzi{
  font-family:var(--serif);color:var(--jade);font-weight:400;
  font-size:.82em;margin-left:.45em;cursor:pointer;border-bottom:1px dotted var(--jade);
}
.hanzi:hover{color:var(--cinnabar);border-color:var(--cinnabar)}
.meta{
  display:flex;flex-wrap:wrap;gap:6px 18px;
  margin:6px 0 16px;font-size:14px;color:var(--ink-soft);
}
.meta span::before{content:"";display:inline-block;width:6px;height:6px;background:var(--loess);margin-right:7px;vertical-align:2px}
.day p{margin:0 0 14px}
.note{
  border-left:3px solid var(--jade);
  padding:2px 0 2px 15px;margin:18px 0 0;
  font-size:15px;color:var(--ink-soft);max-width:64ch;
}
.note strong{color:var(--ink);font-weight:500}
.note.warn{border-color:var(--cinnabar)}

/* ---------- photos ---------- */
figure{margin:20px 0 0}
.shot{
  position:relative;width:100%;aspect-ratio:3/2;
  background:var(--paper-2);
  border:1px solid var(--rule);
  overflow:hidden;
}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  text-align:center;padding:20px;
  color:var(--ink-faint);font-size:13.5px;line-height:1.5;
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(140,150,143,.08) 9px,rgba(140,150,143,.08) 18px);
}
.shot img[src]:not([src=""]){position:relative;z-index:1}
figcaption{font-size:13px;color:var(--ink-faint);margin-top:7px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;margin:20px 0 0;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:11px 14px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-weight:500;color:var(--ink-soft);font-size:13.5px}
.tbl td:first-child{font-weight:500}

/* ---------- checklist ---------- */
.check{list-style:none;padding:0;margin:16px 0 0;max-width:62ch}
.check li{padding:9px 0 9px 30px;border-bottom:1px solid var(--rule);position:relative;font-size:15.5px}
.check li::before{
  content:"";position:absolute;left:0;top:14px;
  width:13px;height:13px;border:1px solid var(--ink-faint);
}
.check li.done::before{background:var(--jade);border-color:var(--jade)}

footer{padding:44px 0 0;color:var(--ink-faint);font-size:13.5px}

@media(max-width:620px){
  body{font-size:16px}
  #doc{padding:0 18px 70px}
  .hero{padding:44px 0 30px}
  .day{grid-template-columns:40px 1fr;gap:0 16px;padding:34px 0}
  .seal{width:34px;height:34px;font-size:16px}
  .spine::after{left:16px;top:44px;bottom:-34px}
  .stage{display:none}
  .facts{gap:0 24px}
}
@media(prefers-reduced-motion:no-preference){
  #doc.on{animation:fade .45s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
@media print{
  #gate{display:none}
  .shot{display:none}
  body{background:#fff}
}
</style>
</head>

    <button id="go">Öffnen</button>
    <p id="err" role="status" aria-live="polite"></p>
  </div>
</div>

<main id="doc"></main>

const ITER = 250000;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const raw = b64(PAYLOAD);
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const data = raw.slice(28);
  const keyMat = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256" },
    keyMat, { name:"AES-GCM", length:256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, data);
  return new TextDecoder().decode(plain);
}

const gate = document.getElementById("gate");
const doc  = document.getElementById("doc");
const err  = document.getElementById("err");
const btn  = document.getElementById("go");
const pw   = document.getElementById("pw");

async function attempt(){
  const val = pw.value;
  if(!val){ err.textContent = "Bitte Passwort eingeben."; return; }
  btn.disabled = true; err.textContent = "Entschlüssle…";
  try{
    const html = await unlock(val);
    doc.innerHTML = html;
    gate.remove();
    doc.classList.add("on");
    document.title = "Shenzhen → Xi'an · 11 Tage";
    try{ sessionStorage.setItem("k", val); }catch(e){}
    wireCopy();
  }catch(e){
    err.textContent = "Falsches Passwort.";
    btn.disabled = false;
    pw.select();
  }
}

btn.addEventListener("click", attempt);
pw.addEventListener("keydown", e => { if(e.key === "Enter") attempt(); });

/* Hanzi antippen kopiert die Schriftzeichen – praktisch für Amap oder zum Vorzeigen */
function wireCopy(){
  doc.querySelectorAll(".hanzi").forEach(el => {
    el.setAttribute("role","button");
    el.setAttribute("tabindex","0");
    el.title = "Tippen zum Kopieren";
    const fire = () => {
      navigator.clipboard.writeText(el.dataset.cn || el.textContent.trim()).then(() => {
        const old = el.textContent;
        el.textContent = "kopiert";
        setTimeout(() => { el.textContent = old; }, 900);
      }).catch(()=>{});
    };
    el.addEventListener("click", fire);
    el.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fire(); } });
  });
  /* Fotoplatzhalter: fehlende Bilder sauber ausblenden */
  doc.querySelectorAll(".shot img").forEach(img => {
    img.addEventListener("error", () => { img.style.display = "none"; });
  });
}

/* Innerhalb derselben Session nicht erneut fragen */
(async () => {
  let k = null;
  try{ k = sessionStorage.getItem("k"); }catch(e){}
  if(k){ pw.value = k; await attempt(); }
})();
</script>
